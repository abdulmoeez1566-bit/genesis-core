<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis Core: The Omniscient Reality Matrix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #030305;
            color: #f3f4f6;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }
        .header {
            text-align: center;
            padding-top: 40px;
        }
        .logo-title {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }
        .owner {
            font-size: 1.1rem;
            color: #9ca3af;
            margin-top: 8px;
            letter-spacing: 1px;
        }
        .owner span {
            color: #38bdf8;
            font-weight: 700;
        }
        .container {
            width: 100%;
            max-width: 800px;
            padding: 0 20px;
            text-align: center;
        }
        .terminal-box {
            background: rgba(15, 15, 20, 0.8);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        .terminal-box h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #e5e7eb;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .input-box {
            flex: 1;
            padding: 15px 20px;
            background: #09090b;
            border: 1px solid #27272a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-box:focus {
            border-color: #ffd700;
        }
        .execute-btn {
            padding: 0 25px;
            background: linear-gradient(135deg, #ffd700, #e6c200);
            color: #000;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .execute-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }
        .footer {
            padding-bottom: 30px;
            text-align: center;
            font-size: 0.9rem;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="logo-title">Genesis Core</h1>
        <p class="owner">Architected & Solely Owned by <span>Abdul Moeez</span></p>
    </div>

    <div class="container">
        <div class="terminal-box">
            <h2>The Omniscient Reality Matrix</h2>
            <p style="color: #9ca3af; font-size: 0.95rem;">"Where Human Thought Becomes Absolute Reality."</p>
            <div class="input-group">
                <input type="text" class="input-box" placeholder="What impossible reality do you want to create today?">
                <button class="execute-btn">EXECUTE</button>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2026 Genesis Core. Masterminded in Pakistan for the Universe.</p>
    </div>

</body>
</html>
